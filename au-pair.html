<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  Redirección de la antigua página /au-pair a la home.
  El servicio Au Pair fue retirado (el negocio es solo certificados médicos
  ocupacionales). Este stub existe para no dejar un 404 en la URL que ya
  estaba indexada en Google.

  Host estático (GitHub Pages) no admite 301 de servidor, así que se usa
  redirección de cliente: meta refresh + canonical a la home + JS.
  Si el sitio migra a Apache/GoDaddy, el 301 real vive en .htaccess.
-->
<title>Página movida — Certificado Médico Virtual</title>
<link rel="canonical" href="https://certificadomedicovirtual.com/">
<meta http-equiv="refresh" content="0; url=https://certificadomedicovirtual.com/">
<meta name="robots" content="noindex, follow">
<script>window.location.replace("https://certificadomedicovirtual.com/");</script>
</head>
<body>
<p>Esta página ya no está disponible. Te estamos llevando a
<a href="https://certificadomedicovirtual.com/">certificadomedicovirtual.com</a>.</p>
</body>
</html>
