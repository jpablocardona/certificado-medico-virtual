<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Fondo hueso -->
  <rect width="1200" height="630" fill="#F5F2EC"/>

  <!-- Bloque verde izquierdo -->
  <rect x="0" y="0" width="520" height="630" fill="#0B3D3A"/>

  <!-- Textura sutil: anillos decorativos del sello, grandes y tenues -->
  <circle cx="260" cy="315" r="280" fill="none" stroke="#C9A66B" stroke-width="1" opacity="0.18"/>
  <circle cx="260" cy="315" r="230" fill="none" stroke="#C9A66B" stroke-width="1" opacity="0.12"/>

  <!-- Logo: pulso ECG + check -->
  <g transform="translate(170, 230)">
    <path d="M 0 30 L 32 30 L 50 0 L 72 60 L 90 30 L 122 30"
          fill="none" stroke="#F5F2EC" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 122 30 L 140 50 L 168 10"
          fill="none" stroke="#C9A66B" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Nombre del servicio en el bloque verde -->
  <text x="260" y="355" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="600" fill="#F5F2EC" letter-spacing="0.5">Certificado Médico Virtual</text>
  <text x="260" y="390" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#C9A66B" letter-spacing="1">Dr. Felipe Mejía</text>

  <!-- Separador vertical sutil -->
  <rect x="520" y="80" width="1" height="470" fill="#0B3D3A" opacity="0.12"/>

  <!-- Copy principal derecha -->
  <text x="600" y="210" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#0B3D3A" letter-spacing="-0.5">Tu certificado médico</text>
  <text x="600" y="265" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#0B3D3A" letter-spacing="-0.5">ocupacional,</text>
  <text x="600" y="320" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#C9A66B" letter-spacing="-0.5">validado por un especialista.</text>

  <!-- Descriptor -->
  <text x="600" y="375" font-family="Arial, sans-serif" font-size="20" fill="#6B6862">100% virtual · Manizales, Colombia</text>

  <!-- Divider -->
  <rect x="600" y="405" width="60" height="2" fill="#C9A66B" rx="1"/>

  <!-- Trust items -->
  <text x="600" y="445" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0B3D3A">15 años</text>
  <text x="690" y="445" font-family="Arial, sans-serif" font-size="17" fill="#6B6862">de experiencia</text>
  <text x="840" y="445" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0B3D3A">6/7 días</text>
  <text x="930" y="445" font-family="Arial, sans-serif" font-size="17" fill="#6B6862">de atención</text>

  <!-- URL / dominio -->
  <text x="600" y="530" font-family="Arial, sans-serif" font-size="16" fill="#6B6862" opacity="0.7">certificadomedicovirtual.com</text>
</svg>
